<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Kelulusan SMA</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; }
.page { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
.header h1 { font-size: 1.4rem; font-weight: 600; }
.nav-links { display: flex; gap: 1rem; }
.nav-links a { color: #2563eb; text-decoration: none; font-size: 14px; cursor: pointer; }
.nav-links a:hover { text-decoration: underline; }
.card { background: #fff; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; border: 1px solid #e5e5e5; }
.card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
.hint { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 0.75rem; }
.hint code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; display: inline-block; margin-top: 4px; }
.file-drop { border: 2px dashed #d0d0d0; border-radius: 10px; padding: 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; margin-bottom: 1rem; }
.file-drop:hover, .file-drop.drag-over { border-color: #2563eb; background: #eff6ff; }
.drop-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.file-drop p { font-size: 14px; color: #666; }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1rem; }
.stat-box { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 1rem; text-align: center; }
.stat-box span { display: block; font-size: 1.8rem; font-weight: 700; color: #2563eb; }
.stat-box.big span { font-size: 2.5rem; }
.stat-box label { font-size: 12px; color: #888; margin-top: 4px; display: block; }
.name-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
.name-tag { background: #eff6ff; color: #1d4ed8; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.name-tag.muted { background: #f5f5f0; color: #888; }
.btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; margin-top: 0.5rem; transition: background 0.2s; }
.btn-primary:hover { background: #1d4ed8; }
.btn-primary:disabled { background: #93c5fd; cursor: default; }
.btn-secondary { background: #f5f5f0; color: #333; border: 1px solid #ddd; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; width: 100%; margin-top: 0.5rem; }
.btn-secondary:hover { background: #e8e8e4; }
.progress-bar { background: #e5e5e5; border-radius: 99px; height: 8px; margin: 1rem 0 0.5rem; }
.progress-fill { background: #2563eb; height: 8px; border-radius: 99px; transition: width 0.2s; width: 0%; }
.qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-top: 1rem; }
.qr-item { background: #f9f9f9; border: 1px solid #eee; border-radius: 10px; padding: 10px; text-align: center; overflow: hidden; }
.qr-item img, .qr-item canvas { width: 100%; border-radius: 6px; }
.qr-item p { font-size: 11px; color: #555; margin-top: 6px; word-break: break-word; }
.muted-card { display: flex; align-items: center; justify-content: center; min-height: 140px; }
.muted-card p { font-size: 13px; color: #999; text-align: center; }
.scanner-card { text-align: center; }
#reader { width: 100%; max-width: 400px; margin: 0 auto 1rem; border-radius: 10px; overflow: hidden; }
.scan-status { padding: 12px 16px; border-radius: 8px; margin-bottom: 1rem; font-size: 15px; font-weight: 500; }
.scan-status.idle { background: #f5f5f0; color: #555; }
.scan-status.success { background: #dcfce7; color: #15803d; }
.scan-status.error { background: #fee2e2; color: #b91c1c; }
.scan-status.warn { background: #fef9c3; color: #854d0e; }
.scan-status.loading { background: #eff6ff; color: #1d4ed8; }
.last-scan-name { font-size: 1.5rem; font-weight: 700; color: #15803d; margin: 0.5rem 0; padding: 1rem; background: #dcfce7; border-radius: 8px; text-align: center; }
.attendee-list { display: flex; flex-direction: column; gap: 4px; }
.attendee-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; }
.attendee-row:hover { background: #f9f9f9; }
.attendee-num { width: 28px; height: 28px; border-radius: 50%; background: #eff6ff; color: #2563eb; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.attendee-name { flex: 1; font-size: 14px; font-weight: 500; }
.attendee-time { font-size: 12px; color: #888; white-space: nowrap; }
input[type=text] { border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; font-size: 14px; outline: none; }
input[type=text]:focus { border-color: #2563eb; }
</style>
</head>
<body>
<div id="app"></div>

<script defer src="./libs/qrcode.min.js"></script>
<script defer src="./libs/jszip.min.js"></script>
<script defer src="./libs/html5-qrcode.min.js"></script>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js"}}
</script>

<script type="module">
import { initializeApp } from "firebase/app";
import { getDatabase, ref, set, onValue, get } from "firebase/database";

// ============================================================
//  KONFIGURASI FIREBASE — ganti dengan config project kamu
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDfhZ0z0SMoPnIKTylV3VSGu2gxyTZkF6U",
  authDomain: "qrverena.firebaseapp.com",
  databaseURL: "https://qrverena-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "qrverena",
  storageBucket: "qrverena.firebasestorage.app",
  messagingSenderId: "372548082779",
  appId: "1:372548082779:web:5f874b4d92e77afbef337e"
};

// ============================================================
//  SECRET KEY — ubah menjadi string rahasia milikmu!
// ============================================================
const SECRET_KEY = "KELULUSAN2025SMAKU";

const firebaseApp = initializeApp(firebaseConfig);
const db = getDatabase(firebaseApp);

// ============================================================
//  ENKRIPSI / DEKRIPSI
// ============================================================
function xorEncode(text, key) {
  let result = '';
  for (let i = 0; i < text.length; i++)
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  return btoa(unescape(encodeURIComponent(result)));
}

function xorDecode(encoded, key) {
  try {
    const raw = decodeURIComponent(escape(atob(encoded)));
    let result = '';
    for (let i = 0; i < raw.length; i++)
      result += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    return result;
  } catch { return null; }
}

// ============================================================
//  TUNGGU LIBRARY GLOBAL SIAP
// ============================================================
function waitForLib(name, timeout = 8000) {
  return new Promise((resolve, reject) => {
    if (window[name]) return resolve(window[name]);
    const start = Date.now();
    const t = setInterval(() => {
      if (window[name]) { clearInterval(t); resolve(window[name]); }
      else if (Date.now() - start > timeout) { clearInterval(t); reject(); }
    }, 100);
  });
}

// ============================================================
//  ROUTER
// ============================================================
function getPage() {
  const h = window.location.hash;
  if (h === '#scanner') return 'scanner';
  if (h === '#dashboard') return 'dashboard';
  return 'admin';
}

function render() {
  if (window._scanner) { window._scanner.stop().catch(()=>{}); window._scanner = null; }
  const page = getPage();
  document.getElementById('app').innerHTML = '';
  if (page === 'admin') renderAdmin();
  else if (page === 'scanner') renderScanner();
  else renderDashboard();
}

// ============================================================
//  ADMIN
// ============================================================
function renderAdmin() {
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="header">
        <h1>Admin — Generate QR</h1>
        <div class="nav-links">
          <a onclick="location.hash='scanner'">Scanner</a>
          <a onclick="location.hash='dashboard'">Dashboard</a>
        </div>
      </div>
      <div class="card">
        <h2>Upload data siswa</h2>
        <p class="hint">Format: satu nama per baris (file .txt atau .csv)<br>
          <code>Budi Santoso</code> <code>Siti Rahayu</code>
        </p>
        <div class="file-drop" id="fileDrop">
          <div class="drop-icon">📄</div>
          <p>Klik atau drag & drop file di sini</p>
          <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
        </div>
        <div id="preview" style="display:none">
          <div class="stats-row">
            <div class="stat-box"><span id="totalCount">0</span><label>Total siswa</label></div>
          </div>
          <div class="name-preview" id="namePreview"></div>
          <button class="btn-primary" id="generateBtn">🎯 Generate semua QR code</button>
        </div>
        <div id="progressWrap" style="display:none; margin-top:1rem;">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <p id="progressText" style="font-size:13px;color:#666;margin-top:6px;"></p>
        </div>
      </div>
      <div class="card" id="resultCard" style="display:none">
        <h2>✅ QR code siap!</h2>
        <p class="hint">Download ZIP berisi semua file QR PNG, satu per siswa.</p>
        <button class="btn-primary" id="downloadBtn">⬇ Download ZIP semua QR</button>
        <div class="qr-grid" id="qrGrid"></div>
      </div>
    </div>`;

  let names = [], qrDataURLs = [];

  const fileDrop = document.getElementById('fileDrop');
  const csvFile  = document.getElementById('csvFile');
  fileDrop.addEventListener('click', () => csvFile.click());
  fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
  fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
  fileDrop.addEventListener('drop', e => { e.preventDefault(); fileDrop.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });
  csvFile.addEventListener('change', e => handleFile(e.target.files[0]));

  function handleFile(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = e => {
      names = e.target.result.split('\n').map(n => n.trim().replace(/\r/g,'')).filter(Boolean);
      document.getElementById('totalCount').textContent = names.length;
      const prev = names.slice(0,5).map(n=>`<span class="name-tag">${n}</span>`).join('');
      document.getElementById('namePreview').innerHTML = prev + (names.length>5 ? `<span class="name-tag muted">+${names.length-5} lainnya</span>` : '');
      document.getElementById('preview').style.display = 'block';
    };
    r.readAsText(file);
  }

  document.getElementById('generateBtn').addEventListener('click', async () => {
    if (!names.length) return;
    let QRC, ZIP;
    try { QRC = await waitForLib('QRCode'); } catch { alert('Library QRCode belum load. Pastikan ada internet lalu refresh.'); return; }
    try { ZIP = await waitForLib('JSZip'); } catch { alert('Library JSZip belum load. Pastikan ada internet lalu refresh.'); return; }

    document.getElementById('generateBtn').disabled = true;
    document.getElementById('progressWrap').style.display = 'block';
    qrDataURLs = [];

    for (let i = 0; i < names.length; i++) {
      const encoded = xorEncode(names[i], SECRET_KEY);
      const canvas  = document.createElement('canvas');
      await QRC.toCanvas(canvas, encoded, { width: 300, margin: 2 });
      qrDataURLs.push({ name: names[i], dataURL: canvas.toDataURL('image/png') });
      const pct = Math.round((i+1)/names.length*100);
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressText').textContent  = `${i+1} / ${names.length} — ${names[i]}`;
      if (i % 10 === 0) await new Promise(r => setTimeout(r, 0));
    }

    document.getElementById('progressText').textContent = `✅ Selesai! ${names.length} QR dibuat.`;
    document.getElementById('resultCard').style.display = 'block';

    const grid = document.getElementById('qrGrid');
    qrDataURLs.slice(0,12).forEach(({name, dataURL}) => {
      const div = document.createElement('div'); div.className = 'qr-item';
      const img = document.createElement('img'); img.src = dataURL; img.alt = name;
      const p   = document.createElement('p');   p.textContent = name;
      div.append(img, p); grid.appendChild(div);
    });
    if (names.length > 12) grid.innerHTML += `<div class="qr-item muted-card"><p>+${names.length-12} QR lainnya ada di ZIP</p></div>`;

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const btn = document.getElementById('downloadBtn');
      btn.textContent = '⏳ Menyiapkan ZIP...'; btn.disabled = true;
      const zip = new ZIP();
      qrDataURLs.forEach(({name, dataURL}) => {
        zip.file(name.replace(/[^a-zA-Z0-9 _\-(). ]/g,'_') + '.png', dataURL.split(',')[1], { base64: true });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'QR_Kelulusan.zip' });
      a.click();
      btn.textContent = '⬇ Download ZIP semua QR'; btn.disabled = false;
    });
  });
}

// ============================================================
//  SCANNER
// ============================================================
function renderScanner() {
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="header">
        <h1>Scanner Absensi</h1>
        <div class="nav-links">
          <a onclick="location.hash=''">Admin</a>
          <a onclick="location.hash='dashboard'">Dashboard</a>
        </div>
      </div>
      <div class="card scanner-card">
        <div id="reader"></div>
        <div id="scan-status" class="scan-status idle">📷 Tekan tombol untuk mulai</div>
        <button class="btn-primary" id="startBtn">Mulai kamera</button>
        <button class="btn-secondary" id="stopBtn" style="display:none">Stop kamera</button>
      </div>
      <div class="card" id="lastScanned" style="display:none">
        <h2>Terakhir di-scan</h2>
        <div class="last-scan-name" id="lastScanName"></div>
        <p class="hint" id="lastScanTime" style="text-align:center;margin-top:4px;"></p>
      </div>
    </div>`;

  const setStatus = (type, text) => {
    const el = document.getElementById('scan-status');
    if (el) { el.className = 'scan-status ' + type; el.textContent = text; }
  };

  document.getElementById('startBtn').addEventListener('click', async () => {
    let H5Q;
    try { H5Q = await waitForLib('Html5Qrcode'); } catch { setStatus('error','❌ Library scanner gagal load.'); return; }
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display  = 'inline-block';
    const scanner = new H5Q("reader");
    window._scanner = scanner;
    try {
      await scanner.start({ facingMode:"environment" }, { fps:10, qrbox:{width:250,height:250} }, onScan, ()=>{});
      setStatus('idle','📷 Arahkan QR code ke kamera');
    } catch {
      setStatus('error','❌ Tidak bisa akses kamera. Berikan izin kamera.');
      document.getElementById('startBtn').style.display  = 'inline-block';
      document.getElementById('stopBtn').style.display   = 'none';
    }
  });

  document.getElementById('stopBtn').addEventListener('click', () => {
    if (window._scanner) { window._scanner.stop().catch(()=>{}); window._scanner = null; }
    document.getElementById('startBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display  = 'none';
    setStatus('idle','📷 Kamera dimatikan');
  });

  let lastCode = '', lastTime = 0;
  async function onScan(raw) {
    const now = Date.now();
    if (raw === lastCode && now - lastTime < 3000) return;
    lastCode = raw; lastTime = now;
    const name = xorDecode(raw, SECRET_KEY);
    if (!name) { setStatus('error','❌ QR tidak valid — bukan dari sistem ini'); return; }
    setStatus('loading','⏳ Menyimpan...');
    try {
      const key  = name.replace(/[^a-zA-Z0-9]/g,'_');
      const snap = await get(ref(db, `absensi/${key}`));
      if (snap.exists()) {
        setStatus('warn', `⚠️ ${name} sudah tercatat hadir`);
      } else {
        await set(ref(db, `absensi/${key}`), { nama: name, waktu: new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'}), timestamp: now });
        setStatus('success', `✅ ${name} berhasil dicatat!`);
      }
      const card = document.getElementById('lastScanned');
      if (card) {
        card.style.display = 'block';
        document.getElementById('lastScanName').textContent = name;
        document.getElementById('lastScanTime').textContent = new Date().toLocaleTimeString('id-ID');
      }
    } catch(err) {
      setStatus('error','❌ Gagal simpan. Cek koneksi & Firebase config.');
      console.error(err);
    }
  }
}

// ============================================================
//  DASHBOARD
// ============================================================
function renderDashboard() {
  document.getElementById('app').innerHTML = `
    <div class="page">
      <div class="header">
        <h1>Dashboard Kehadiran</h1>
        <div class="nav-links">
          <a onclick="location.hash=''">Admin</a>
          <a onclick="location.hash='scanner'">Scanner</a>
        </div>
      </div>
      <div class="stats-row">
        <div class="stat-box big"><span id="hadirCount">—</span><label>Sudah hadir</label></div>
        <div class="stat-box big"><span>167</span><label>Total siswa</label></div>
        <div class="stat-box big"><span id="persenHadir">—</span><label>Persentase</label></div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px;">
          <h2 style="margin:0">Daftar hadir</h2>
          <input type="text" id="search" placeholder="Cari nama..." style="width:180px">
        </div>
        <div id="attendeeList" class="attendee-list">
          <p class="hint" style="text-align:center;padding:2rem">Memuat data...</p>
        </div>
      </div>
    </div>`;

  let all = [];
  onValue(ref(db,'absensi'), snap => {
    all = Object.values(snap.val()||{}).sort((a,b)=>a.timestamp-b.timestamp);
    document.getElementById('hadirCount').textContent  = all.length;
    document.getElementById('persenHadir').textContent = Math.round(all.length/167*100)+'%';
    renderList(all);
  });

  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    renderList(all.filter(x => x.nama.toLowerCase().includes(q)));
  });

  function renderList(entries) {
    const el = document.getElementById('attendeeList');
    if (!el) return;
    if (!entries.length) { el.innerHTML = '<p class="hint" style="text-align:center;padding:2rem">Belum ada yang hadir</p>'; return; }
    el.innerHTML = entries.map((e,i) => `
      <div class="attendee-row">
        <span class="attendee-num">${i+1}</span>
        <span class="attendee-name">${e.nama}</span>
        <span class="attendee-time">${e.waktu}</span>
      </div>`).join('');
  }
}

window.addEventListener('load', () => {
console.log("QRCode =", window.QRCode);
console.log("JSZip =", window.JSZip);
console.log("Html5Qrcode =", window.Html5Qrcode);
  window.addEventListener('hashchange', render);
  render();
});
</script>
</body>
