<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absensi Kelulusan SMA</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ============================================================
  //  KONFIGURASI FIREBASE — ganti dengan config project kamu
  // ============================================================
  const firebaseConfig = {
  apiKey: "AIzaSyDfhZ0z0SMoPnIKTylV3VSGu2gxyTZkF6U",
  authDomain: "qrverena.firebaseapp.com",
  projectId: "qrverena",
  storageBucket: "qrverena.firebasestorage.app",
  messagingSenderId: "372548082779",
  appId: "1:372548082779:web:5f874b4d92e77afbef337e",
  measurementId: "G-QK2Q69JKFQ",
  databaseURL: "https://qrverena-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };

  // ============================================================
  //  SECRET KEY — ubah menjadi string rahasia milikmu!
  //  Jangan bagikan ke siapapun selain panitia.
  // ============================================================
  const SECRET_KEY = "KELULUSAN2025SMAKU";

  // ============================================================
  //  Inisialisasi Firebase
  // ============================================================
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ============================================================
  //  ENKRIPSI / DEKRIPSI
  //  XOR sederhana + base64 — cukup untuk mencegah scanner biasa
  // ============================================================
  function xorEncode(text, key) {
    let result = '';
    for (let i = 0; i < text.length; i++) {
      result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
    }
    return btoa(unescape(encodeURIComponent(result)));
  }

  function xorDecode(encoded, key) {
    try {
      const raw = decodeURIComponent(escape(atob(encoded)));
      let result = '';
      for (let i = 0; i < raw.length; i++) {
        result += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return result;
    } catch {
      return null;
    }
  }

  // ============================================================
  //  ROUTER
  // ============================================================
  function getPage() {
    const h = window.location.hash;
    if (h === '#scanner') return 'scanner';
    if (h === '#dashboard') return 'dashboard';
    return 'admin';
  }

  function navigate(page) {
    window.location.hash = page === 'admin' ? '' : page;
    render();
  }

  // ============================================================
  //  RENDER UTAMA
  // ============================================================
  function render() {
    const page = getPage();
    document.getElementById('app').innerHTML = '';
    if (page === 'admin') renderAdmin();
    else if (page === 'scanner') renderScanner();
    else renderDashboard();
  }

  // ============================================================
  //  HALAMAN ADMIN
  // ============================================================
  function renderAdmin() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="page">
        <div class="header">
          <h1>Admin — Generate QR</h1>
          <div class="nav-links">
            <a href="#scanner">Scanner</a>
            <a href="#dashboard">Dashboard</a>
          </div>
        </div>

        <div class="card">
          <h2>Upload data siswa</h2>
          <p class="hint">Format CSV: satu nama per baris (tanpa header). Contoh:<br>
            <code>Budi Santoso<br>Siti Rahayu<br>Ahmad Fauzi</code>
          </p>
          <div class="file-drop" id="fileDrop">
            <div class="drop-icon">📄</div>
            <p>Klik atau drag & drop file CSV di sini</p>
            <input type="file" id="csvFile" accept=".csv,.txt" style="display:none">
          </div>
          <div id="preview" style="display:none">
            <div class="stats-row">
              <div class="stat-box"><span id="totalCount">0</span><label>Total siswa</label></div>
            </div>
            <div class="name-preview" id="namePreview"></div>
            <button class="btn-primary" id="generateBtn">Generate semua QR code</button>
          </div>
          <div id="progress" style="display:none">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <p id="progressText">Generating...</p>
          </div>
        </div>

        <div class="card" id="resultCard" style="display:none">
          <h2>QR code siap!</h2>
          <p class="hint">Download ZIP berisi semua QR code. Setiap file PNG diberi nama sesuai nama siswa.</p>
          <button class="btn-primary" id="downloadBtn">⬇ Download ZIP semua QR</button>
          <div class="qr-grid" id="qrGrid"></div>
        </div>
      </div>
    `;

    let names = [];
    let qrDataURLs = [];

    const fileDrop = document.getElementById('fileDrop');
    const csvFile = document.getElementById('csvFile');

    fileDrop.addEventListener('click', () => csvFile.click());
    fileDrop.addEventListener('dragover', e => { e.preventDefault(); fileDrop.classList.add('drag-over'); });
    fileDrop.addEventListener('dragleave', () => fileDrop.classList.remove('drag-over'));
    fileDrop.addEventListener('drop', e => {
      e.preventDefault();
      fileDrop.classList.remove('drag-over');
      handleFile(e.dataTransfer.files[0]);
    });
    csvFile.addEventListener('change', e => handleFile(e.target.files[0]));

    function handleFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        names = e.target.result.split('\n')
          .map(n => n.trim().replace(/\r/g, ''))
          .filter(n => n.length > 0);
        document.getElementById('totalCount').textContent = names.length;
        const preview = names.slice(0, 5).map(n => `<span class="name-tag">${n}</span>`).join('');
        document.getElementById('namePreview').innerHTML = preview + (names.length > 5 ? `<span class="name-tag muted">+${names.length - 5} lainnya...</span>` : '');
        document.getElementById('preview').style.display = 'block';
      };
      reader.readAsText(file);
    }

    document.getElementById('generateBtn') && document.getElementById('generateBtn').addEventListener('click', async () => {
      if (names.length === 0) return;
      document.getElementById('progress').style.display = 'block';
      document.getElementById('generateBtn').disabled = true;
      qrDataURLs = [];

      for (let i = 0; i < names.length; i++) {
        const encoded = xorEncode(names[i], SECRET_KEY);
        const canvas = document.createElement('canvas');
        await QRCode.toCanvas(canvas, encoded, { width: 300, margin: 2 });
        qrDataURLs.push({ name: names[i], dataURL: canvas.toDataURL('image/png') });

        const pct = Math.round(((i + 1) / names.length) * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = `${i + 1} / ${names.length} — ${names[i]}`;
        await new Promise(r => setTimeout(r, 10));
      }

      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('progressText').textContent = `Selesai! ${names.length} QR code dibuat.`;

      const grid = document.getElementById('qrGrid');
      qrDataURLs.slice(0, 12).forEach(({ name, dataURL }) => {
        grid.innerHTML += `<div class="qr-item"><img src="${dataURL}" alt="${name}"><p>${name}</p></div>`;
      });
      if (names.length > 12) {
        grid.innerHTML += `<div class="qr-item muted-card"><p>+${names.length - 12} QR lainnya<br>ada di ZIP</p></div>`;
      }

      document.getElementById('downloadBtn').addEventListener('click', async () => {
        const zip = new JSZip();
        qrDataURLs.forEach(({ name, dataURL }) => {
          const base64 = dataURL.split(',')[1];
          const safeName = name.replace(/[^a-zA-Z0-9 _\-().]/g, '_');
          zip.file(`${safeName}.png`, base64, { base64: true });
        });
        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'QR_Kelulusan.zip';
        a.click();
      });
    });
  }

  // ============================================================
  //  HALAMAN SCANNER
  // ============================================================
  let html5QrCode = null;

  function renderScanner() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="page">
        <div class="header">
          <h1>Scanner Absensi</h1>
          <div class="nav-links">
            <a href="#">Admin</a>
            <a href="#dashboard">Dashboard</a>
          </div>
        </div>

        <div class="card scanner-card">
          <div id="reader"></div>
          <div id="scan-status" class="scan-status idle">
            <span id="status-icon">📷</span>
            <span id="status-text">Arahkan QR code ke kamera</span>
          </div>
          <button class="btn-primary" id="startBtn">Mulai kamera</button>
          <button class="btn-secondary" id="stopBtn" style="display:none">Stop kamera</button>
        </div>

        <div class="card" id="lastScanned" style="display:none">
          <h2>Terakhir di-scan</h2>
          <div class="last-scan-name" id="lastScanName"></div>
          <div id="lastScanTime" class="hint"></div>
        </div>
      </div>
    `;

    document.getElementById('startBtn').addEventListener('click', startScanner);
    document.getElementById('stopBtn').addEventListener('click', stopScanner);

    async function startScanner() {
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'inline-block';

      html5QrCode = new Html5Qrcode("reader");
      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 250, height: 250 } },
          onScanSuccess,
          () => {}
        );
      } catch (err) {
        setStatus('error', '❌ Tidak bisa akses kamera. Pastikan izin kamera diberikan.');
      }
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().catch(() => {});
        html5QrCode = null;
      }
      document.getElementById('startBtn').style.display = 'inline-block';
      document.getElementById('stopBtn').style.display = 'none';
      setStatus('idle', '📷 Kamera dimatikan');
    }

    let lastScannedCode = '';
    let lastScannedTime = 0;

    async function onScanSuccess(rawValue) {
      const now = Date.now();
      if (rawValue === lastScannedCode && now - lastScannedTime < 3000) return;
      lastScannedCode = rawValue;
      lastScannedTime = now;

      const name = xorDecode(rawValue, SECRET_KEY);
      if (!name) {
        setStatus('error', '❌ QR tidak valid — bukan dari sistem ini');
        return;
      }

      setStatus('loading', '⏳ Menyimpan...');

      try {
        const key = name.replace(/[^a-zA-Z0-9]/g, '_');
        const entryRef = ref(db, `absensi/${key}`);
        const snapshot = await get(entryRef);

        if (snapshot.exists()) {
          setStatus('warn', `⚠️ ${name} sudah tercatat hadir`);
        } else {
          await set(entryRef, {
            nama: name,
            waktu: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' }),
            timestamp: now
          });
          setStatus('success', `✅ ${name} berhasil dicatat!`);
        }

        document.getElementById('lastScanned').style.display = 'block';
        document.getElementById('lastScanName').textContent = name;
        document.getElementById('lastScanTime').textContent = new Date().toLocaleTimeString('id-ID');
      } catch (err) {
        setStatus('error', '❌ Gagal menyimpan. Cek koneksi internet.');
      }
    }

    function setStatus(type, text) {
      const el = document.getElementById('scan-status');
      el.className = 'scan-status ' + type;
      document.getElementById('status-text').textContent = text;
    }
  }

  // ============================================================
  //  HALAMAN DASHBOARD
  // ============================================================
  function renderDashboard() {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="page">
        <div class="header">
          <h1>Dashboard Kehadiran</h1>
          <div class="nav-links">
            <a href="#">Admin</a>
            <a href="#scanner">Scanner</a>
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-box big">
            <span id="hadirCount">—</span>
            <label>Sudah hadir</label>
          </div>
          <div class="stat-box big">
            <span id="totalSiswa">167</span>
            <label>Total siswa</label>
          </div>
          <div class="stat-box big">
            <span id="persenHadir">—</span>
            <label>Persentase</label>
          </div>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
            <h2 style="margin:0;">Daftar hadir</h2>
            <input type="text" id="search" placeholder="Cari nama..." style="width: 180px; font-size:13px; padding:6px 10px;">
          </div>
          <div id="attendeeList" class="attendee-list">
            <p class="hint" style="text-align:center; padding: 2rem;">Memuat data...</p>
          </div>
        </div>
      </div>
    `;

    const absensiRef = ref(db, 'absensi');
    onValue(absensiRef, snapshot => {
      const data = snapshot.val() || {};
      const entries = Object.values(data).sort((a, b) => a.timestamp - b.timestamp);

      document.getElementById('hadirCount').textContent = entries.length;
      const pct = Math.round((entries.length / 167) * 100);
      document.getElementById('persenHadir').textContent = pct + '%';

      renderList(entries);

      document.getElementById('search').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        renderList(entries.filter(x => x.nama.toLowerCase().includes(q)));
      });
    });

    function renderList(entries) {
      const list = document.getElementById('attendeeList');
      if (entries.length === 0) {
        list.innerHTML = '<p class="hint" style="text-align:center; padding: 2rem;">Belum ada yang hadir</p>';
        return;
      }
      list.innerHTML = entries.map((e, i) => `
        <div class="attendee-row">
          <span class="attendee-num">${i + 1}</span>
          <span class="attendee-name">${e.nama}</span>
          <span class="attendee-time">${e.waktu}</span>
        </div>
      `).join('');
    }
  }

  // ============================================================
  //  INIT
  // ============================================================
  window.addEventListener('hashchange', render);
  render();
</script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    min-height: 100vh;
  }
  .page { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem;
  }
  .header h1 { font-size: 1.4rem; font-weight: 600; }
  .nav-links { display: flex; gap: 1rem; }
  .nav-links a { color: #2563eb; text-decoration: none; font-size: 14px; }
  .nav-links a:hover { text-decoration: underline; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    border: 1px solid #e5e5e5;
  }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 0.75rem; }
  .hint { font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 0.75rem; }
  .hint code { background: #f0f0f0; padding: 2px 6px; border-radius: 4px; font-family: monospace; display: inline-block; margin-top: 4px; }

  .file-drop {
    border: 2px dashed #d0d0d0;
    border-radius: 10px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin-bottom: 1rem;
  }
  .file-drop:hover, .file-drop.drag-over { border-color: #2563eb; background: #eff6ff; }
  .drop-icon { font-size: 2rem; margin-bottom: 0.5rem; }
  .file-drop p { font-size: 14px; color: #666; }

  .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; margin-bottom: 1rem; }
  .stat-box {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 1rem;
    text-align: center;
  }
  .stat-box span { display: block; font-size: 1.8rem; font-weight: 700; color: #2563eb; }
  .stat-box.big span { font-size: 2.5rem; }
  .stat-box label { font-size: 12px; color: #888; margin-top: 4px; display: block; }

  .name-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1rem; }
  .name-tag {
    background: #eff6ff; color: #1d4ed8;
    border-radius: 6px; padding: 4px 10px; font-size: 13px;
  }
  .name-tag.muted { background: #f5f5f0; color: #888; }

  .btn-primary {
    background: #2563eb; color: #fff;
    border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 14px; font-weight: 500;
    cursor: pointer; width: 100%; margin-top: 0.5rem;
    transition: background 0.2s;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #93c5fd; cursor: default; }
  .btn-secondary {
    background: #f5f5f0; color: #333;
    border: 1px solid #ddd; border-radius: 8px;
    padding: 10px 20px; font-size: 14px;
    cursor: pointer; width: 100%; margin-top: 0.5rem;
    transition: background 0.2s;
  }
  .btn-secondary:hover { background: #e8e8e4; }

  .progress-bar { background: #e5e5e5; border-radius: 99px; height: 8px; margin: 1rem 0 0.5rem; }
  .progress-fill { background: #2563eb; height: 8px; border-radius: 99px; transition: width 0.2s; width: 0%; }

  .qr-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-top: 1rem;
  }
  .qr-item {
    background: #f9f9f9; border: 1px solid #eee;
    border-radius: 10px; padding: 10px;
    text-align: center; overflow: hidden;
  }
  .qr-item img { width: 100%; border-radius: 6px; }
  .qr-item p { font-size: 11px; color: #555; margin-top: 6px; word-break: break-word; }
  .muted-card { display: flex; align-items: center; justify-content: center; min-height: 140px; }
  .muted-card p { font-size: 13px; color: #999; text-align: center; }

  .scanner-card { text-align: center; }
  #reader { width: 100%; max-width: 400px; margin: 0 auto 1rem; border-radius: 10px; overflow: hidden; }
  .scan-status {
    padding: 12px 16px; border-radius: 8px; margin-bottom: 1rem;
    font-size: 15px; font-weight: 500; transition: all 0.3s;
  }
  .scan-status.idle { background: #f5f5f0; color: #555; }
  .scan-status.success { background: #dcfce7; color: #15803d; }
  .scan-status.error { background: #fee2e2; color: #b91c1c; }
  .scan-status.warn { background: #fef9c3; color: #854d0e; }
  .scan-status.loading { background: #eff6ff; color: #1d4ed8; }

  .last-scan-name {
    font-size: 1.5rem; font-weight: 700; color: #15803d;
    margin: 0.5rem 0; padding: 1rem; background: #dcfce7;
    border-radius: 8px; text-align: center;
  }

  .attendee-list { display: flex; flex-direction: column; gap: 4px; }
  .attendee-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 8px; transition: background 0.15s;
  }
  .attendee-row:hover { background: #f9f9f9; }
  .attendee-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: #eff6ff; color: #2563eb;
    font-size: 12px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .attendee-name { flex: 1; font-size: 14px; font-weight: 500; }
  .attendee-time { font-size: 12px; color: #888; white-space: nowrap; }

  input[type=text] {
    border: 1px solid #ddd; border-radius: 8px;
    padding: 8px 12px; font-size: 14px; outline: none;
  }
  input[type=text]:focus { border-color: #2563eb; }
</style>

<body>
<div id="app"></div>
</body>
</html>
